<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}} | Owen Kobasz</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{canonical_url}}" />
    <link rel="icon" href="/assets/fav.png" sizes="32x32" type="image/png" />

    <!-- Open Graph -->
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{canonical_url}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Owen Kobasz" />
    {{og_image_tag}}

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    {{twitter_image_tag}}

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F0EBE0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1A1612" />
    <script>(function(){var t=localStorage.getItem('portfolio-theme');var d=window.matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.setAttribute('data-theme',(t==='dark'||t==='light')?t:(d?'dark':'light'));})();</script>

    <link rel="stylesheet" href="/photos.css" />

    {{analytics_snippet}}
</head>
<body>
    <header class="blog-nav">
        <button class="blog-theme-toggle" id="blog-theme-toggle" type="button" aria-label="Switch to dark mode">
            <svg class="blog-theme-toggle__icon blog-theme-toggle__icon--moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="blog-theme-toggle__icon blog-theme-toggle__icon--sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="blog-nav__toggle" id="blog-nav-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="blog-nav-overlay">
            <img src="/assets/menu.svg" alt="Menu" width="24" height="24" />
        </button>
    </header>

    <div class="blog-nav-overlay" id="blog-nav-overlay" role="dialog" aria-label="Navigation">
        <button class="blog-nav-overlay__close" id="blog-nav-close" aria-label="Close navigation">&times;</button>
        <ul class="blog-nav-overlay__links">
            <li><a href="/" class="blog-nav-overlay__link">Home</a></li>
            <li><a href="/#about" class="blog-nav-overlay__link">About</a></li>
            <li><a href="/#projects" class="blog-nav-overlay__link">Projects</a></li>
            <li><a href="/blog" class="blog-nav-overlay__link">Blog</a></li>
            <li><a href="/photos" class="blog-nav-overlay__link blog-nav-overlay__link--active">Photos</a></li>
            <li><a href="/#contact" class="blog-nav-overlay__link">Contact</a></li>
        </ul>
    </div>

    <main class="photos-album">
        <header class="photos-album__header">
            <a href="/photos" class="photos-album__back">&larr; All albums</a>
            <h1 class="photos-album__title">{{title}}</h1>
            <div class="photos-album__meta">
                <time datetime="{{date_iso}}">{{date_formatted}}</time>
            </div>
            <p class="photos-album__description">{{description}}</p>
        </header>

        <div class="photo-grid">
{{grid_html}}
        </div>
    </main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button class="lightbox__close" id="lightbox-close" aria-label="Close photo viewer">&times;</button>
        <button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" aria-label="Previous photo">&#8592;</button>
        <img class="lightbox__image" id="lightbox-image" alt="" />
        <button class="lightbox__nav lightbox__nav--next" id="lightbox-next" aria-label="Next photo">&#8594;</button>
    </div>

    <footer class="footer">
        <a href="/">
            <div class="return-home">
                <img src="/assets/home.svg" alt="Return to top" width="24" height="24" />
            </div>
        </a>
        <div class="socials">
            <a href="https://github.com/owenkobasz" target="_blank" rel="noopener noreferrer">
                <div class="socials__github">
                    <img src="/assets/github-logo.png" alt="GitHub" />
                </div>
            </a>
            <a href="https://www.linkedin.com/in/owen-kobasz/" target="_blank" rel="noopener noreferrer">
                <div class="socials__linkedin">
                    <img src="/assets/linkedin-logo.svg" alt="LinkedIn" />
                </div>
            </a>
            <a href="mailto:owenkobasz@gmail.com" target="_blank">
                <div class="socials__email">
                    <img src="/assets/mail.png" alt="Email" />
                </div>
            </a>
        </div>
        <p class="copyright">Owen Kobasz © 2026</p>
    </footer>

    <script>
    (function() {
        var overlay  = document.getElementById('blog-nav-overlay');
        var toggle   = document.getElementById('blog-nav-toggle');
        var closeBtn = document.getElementById('blog-nav-close');
        if (!overlay || !toggle) return;

        function openNav() {
            overlay.classList.add('blog-nav-overlay--open');
            toggle.setAttribute('aria-expanded', 'true');
            document.body.style.overflow = 'hidden';
        }
        function closeNav() {
            overlay.classList.remove('blog-nav-overlay--open');
            toggle.setAttribute('aria-expanded', 'false');
            document.body.style.overflow = '';
        }

        toggle.addEventListener('click', openNav);
        if (closeBtn) closeBtn.addEventListener('click', closeNav);
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) closeNav();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeNav();
        });
    })();

    (function() {
        var btn = document.getElementById('blog-theme-toggle');
        if (!btn) return;

        function updateLabel() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            btn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
        }

        updateLabel();

        btn.addEventListener('click', function() {
            var current = document.documentElement.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('portfolio-theme', next);
            updateLabel();
        });
    })();

    (function() {
        var lightbox = document.getElementById('lightbox');
        var imgEl    = document.getElementById('lightbox-image');
        var prevBtn  = document.getElementById('lightbox-prev');
        var nextBtn  = document.getElementById('lightbox-next');
        var closeBtn = document.getElementById('lightbox-close');
        var items    = Array.prototype.slice.call(document.querySelectorAll('.photo-grid__item'));
        if (!lightbox || !imgEl || !items.length) return;

        var urls = items.map(function(a) { return a.getAttribute('href'); });
        var current = -1;
        var origin = null;

        function isOpen() {
            return lightbox.classList.contains('lightbox--open');
        }
        function preload(i) {
            var im = new Image();
            im.src = urls[(i + urls.length) % urls.length];
        }
        function show(i) {
            current = (i + urls.length) % urls.length;
            imgEl.src = urls[current];
            preload(current + 1);
            preload(current - 1);
        }
        function open(i, originEl) {
            origin = originEl || null;
            lightbox.classList.add('lightbox--open');
            document.body.style.overflow = 'hidden';
            show(i);
            closeBtn.focus();
        }
        function close() {
            lightbox.classList.remove('lightbox--open');
            document.body.style.overflow = '';
            imgEl.removeAttribute('src');
            current = -1;
            if (origin) {
                origin.focus();
                origin = null;
            }
        }

        items.forEach(function(a, i) {
            a.addEventListener('click', function(e) {
                e.preventDefault();
                open(i, a);
            });
        });
        prevBtn.addEventListener('click', function() { show(current - 1); });
        nextBtn.addEventListener('click', function() { show(current + 1); });
        closeBtn.addEventListener('click', close);
        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) close();
        });
        document.addEventListener('keydown', function(e) {
            if (!isOpen()) return;
            if (e.key === 'ArrowLeft') show(current - 1);
            else if (e.key === 'ArrowRight') show(current + 1);
            else if (e.key === 'Escape') close();
        });
    })();
    </script>
</body>
</html>
